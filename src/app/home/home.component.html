<app-not-found [visible]="!foods || foods.length <= 0" resetLinkText="Reset Search"></app-not-found>
<app-search></app-search>
<app-tags></app-tags>
<ul>
    <li *ngFor="let food of foods ">
        <a routerLink="/food/{{food.id}}" id="{{food.id}}">
            <img [src]=food.imageUrl  alt="food image" class="food-image">
            <div class="content">
                <div class="name">
                    {{food.name}}
                </div>
                <span class="favorite {{food.favorite?'':'not'}}">❤︎</span>
                <div class="rating">
                    <span *ngFor="let star of stars; let i = index" (click)="rateFood(food, i + 1)" [class]="i < food.star ? 'filled' : 'empty'" aria-readonly="true">&#9733;</span>
                </div>
                <div class="product-item-footer">
                    <div class="origins">
                        <span *ngFor="let origin of food.origins">
                            {{origin}}
                        </span>
                    </div>
                    <div class="cook-time">
                        <span>🕒</span>
                        {{food.cookTime}}
                    </div>
                </div>
                <div class="price">
                    {{food.price|currency}}
                </div>
            </div>
        </a>
    </li>

</ul>
